# Capstone Evaluation Manifest
# Usage Metering & Billing Engine

run: uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python -m app.seed
test: pytest tests/test_billing_engine.py -v
base_url: http://localhost:8000

endpoints:
  health:
    method: GET
    path: /health
    description: Health check and background reconciliation worker status
  ingest_event:
    method: POST
    path: /api/v1/events
    description: Idempotent event metering with deduplication key
  generate:
    method: POST
    path: /api/v1/generate
    description: Billable simulated AI inference endpoint with token breakdown
  get_usage:
    method: GET
    path: /api/v1/customers/{tenant_id}/usage
    description: Real-time usage aggregation and cost calculation
  create_checkout:
    method: POST
    path: /api/v1/checkout/create-session
    description: Stripe test mode checkout initialization
  stripe_webhook:
    method: POST
    path: /api/v1/webhooks/stripe
    description: Signature-verified idempotent Stripe webhook listener
  create_invoice:
    method: POST
    path: /api/v1/customers/{tenant_id}/invoices
    description: Itemized monthly billing invoice generation
